name: Lint

# WoW runs Lua 5.1, so that is what the syntax check must use. luac -p catches
# the whole class of typo that otherwise only shows up as a broken addon in game.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  luac:
    runs-on: ubuntu-latest
    container: nickblah/lua:5.1-luarocks
    steps:
      - uses: actions/checkout@v4

      - name: Check Lua 5.1 syntax
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 \
            | xargs -0 -n1 luac -p

      - name: Run every Lua regression test
        run: |
          set -e
          find tests -maxdepth 1 -type f -name 'test_*.lua' -print | sort \
            | while IFS= read -r test; do lua "$test"; done

      - name: Check each addon's Lua files against its own TOC
        run: |
          check_toc() {
            dir="$1"
            toc="$2"
            awk '!/^[[:space:]]*(#|$)/ { gsub(/\\/, "/"); if ($0 ~ /\.lua$/) print }' \
              "$toc" | tr -d '\r' | sort > /tmp/in_toc
            if [ "$dir" = "." ]; then
              find Core Catalog Features Options UI -name '*.lua' -print \
                | sort > /tmp/on_disk
              printf '%s\n' Core.lua >> /tmp/on_disk
              sort -o /tmp/on_disk /tmp/on_disk
            else
              find "$dir" -maxdepth 1 -name '*.lua' -print | sort > /tmp/on_disk
            fi
            diff -u /tmp/in_toc /tmp/on_disk
          }

          check_toc . Salve.toc
          check_toc . Salve_Camelot.toc

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate built-in catalogue
        run: python3 tools/generate_data_modules.py --check

      - name: Test maintenance tools
        run: python3 tests/test_tools.py
