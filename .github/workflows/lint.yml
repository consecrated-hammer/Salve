name: Lint

# WoW runs Lua 5.1, so that is what the syntax check must use. luac -p catches
# the whole class of typo that otherwise only shows up as a broken addon in game.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  luac:
    runs-on: ubuntu-latest
    container: nickblah/lua:5.1-luarocks
    steps:
      - uses: actions/checkout@v4

      - name: Check Lua 5.1 syntax
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 \
            | xargs -0 -n1 luac -p

      - name: Run every Lua regression test
        run: |
          set -e
          find tests -maxdepth 1 -type f -name 'test_*.lua' -print | sort \
            | while IFS= read -r test; do lua "$test"; done

  hammercore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
      - uses: actions/checkout@v4
        with:
          repository: consecrated-hammer/HammerCore
          path: hammercore
          fetch-depth: 0
      - name: Vendored HammerCore matches its pinned commit
        run: python3 hammercore/tools/check.py addon
      - name: Each TOC loads exactly the addon's Lua files
        run: python3 hammercore/tools/toc_check.py addon

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate built-in catalogue
        run: python3 tools/generate_data_modules.py --check

      - name: Test maintenance tools
        run: python3 tests/test_tools.py
