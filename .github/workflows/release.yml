name: Release

# Tag a commit v1.0.0 (or 1.0.0) and this packages the addon and publishes it.
# CurseForge upload only happens once CF_API_KEY is set in the repository
# secrets AND the TOC carries an X-Curse-Project-ID; without either, the
# packager still builds the zip and attaches it to the GitHub release.
on:
  push:
    tags:
      - "v*"
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The packager builds the changelog from history, so it needs all of it.
          fetch-depth: 0

      # The zip is named from the TAG but the version players see in their addon
      # list comes from the TOC. Letting those drift ships an old version inside a file
      # called 0.2.0, which is confusing to diagnose and impossible to fix after
      # upload. Fail before publishing anything instead.
      # ☠ Strip any -alpha/-beta suffix before comparing. The packager reads the
      #   release TYPE from the tag (a tag containing "beta" uploads as a beta),
      #   so v1.0.0-beta is a normal thing to push -- but the TOC version stays
      #   1.0.0, and a naive comparison would reject every pre-release.
      - name: Tag must match the TOC version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          toc=$(grep -oP '(?<=^## Version:\s).*' Salve.toc | tr -d '[:space:]')
          echo "tag=$tag  toc=$toc"
          if [ "$tag" != "$toc" ]; then
            echo "::error::Tag $tag does not match '## Version: $toc' in Salve.toc."
            exit 1
          fi

      - name: Check the changelog mentions this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"
          # ☠ Require the exact Keep a Changelog heading, hyphen and all:
          #   ## [1.2.3] - 2026-08-17
          # CurseForge parses this format, and an em dash instead of a hyphen
          # stops it sectioning the file -- the whole history then renders as
          # one blob on every release. Cheap to get wrong, invisible until it
          # is published, so make CI refuse it.
          if ! grep -qE "^## \\[$tag\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a heading exactly '## [$tag] - YYYY-MM-DD' (hyphen, not an em dash)."
            exit 1
          fi
          release_date=$(sed -n 's/^## X-ReleaseDate:[[:space:]]*//p' Salve.toc)
          if ! printf '%s' "$release_date" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "::error::Salve.toc needs X-ReleaseDate in YYYY-MM-DD form."
            exit 1
          fi
          if ! grep -Fq "## [$tag] — $release_date" CHANGELOG.md; then
            echo "::error::X-ReleaseDate $release_date does not match CHANGELOG.md for [$tag]."
            exit 1
          fi

      - name: Validate generated data modules
        run: python3 tools/generate_data_modules.py --check

      # Publish ONLY this version's notes. .pkgmeta points the packager at
      # RELEASE_NOTES.md rather than CHANGELOG.md, so what reaches CurseForge is
      # exactly the section below and never the whole history.
      - name: Extract this version's release notes
        run: |
          tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-*}"
          awk -v v="$tag" '
            $0 ~ ("^## \\[" v "\\] - ") { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::Extracted no release notes for $tag from CHANGELOG.md."
            exit 1
          fi
          echo "----- notes for $tag -----"
          cat RELEASE_NOTES.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
